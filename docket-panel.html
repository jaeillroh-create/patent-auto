<!--
  ════════════════════════════════════════════════════════════════
  index.html 통합 가이드 (v2.0)
  ════════════════════════════════════════════════════════════════

  1) <head>에 추가:
     <link rel="stylesheet" href="docket.css" />
     <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>

  2) </body> 직전에 추가:
     <script src="docket.js"></script>

  3) <nav class="service-tab-nav"> 안에 상표 탭 뒤에 추가:
     <button class="service-tab" data-service="docket" onclick="App.switchService('docket')">
       <span class="tossface">📮</span> 사건등록
     </button>

  4) common.js switchService 함수에 추가:
     if (service === 'docket' && window.Docket) Docket.init();

  5) common.js initServiceTabs 함수에 추가:
     if (hash === 'docket') App.switchService('docket');

  6) 아래 HTML을 trademark 패널 뒤에 삽입
-->

<!-- ═══ 사건등록 대시보드 패널 ═══ -->
<div id="docket-dashboard-panel" class="service-panel">
  <div class="dkt-card">
    <div class="dkt-card-title"><span class="tossface">📮</span> 사건등록 · 견적서 발송</div>
    <div class="dkt-card-desc">사건 유형을 선택하면 수수료가 자동 입력됩니다. 수정 후 견적서 엑셀 생성 → 메일 발송까지 한 번에 처리합니다.</div>

    <!-- 수신인 -->
    <div class="dkt-recipient-bar">
      <label>📧 수신인 (docket):</label>
      <input type="email" class="input-field" id="dkt-recipient" value="docket@didimip.com" />
    </div>

    <!-- 상단 메타 정보 -->
    <div class="dkt-meta-grid">
      <div>
        <label>사건 유형</label>
        <select id="dkt-case-template" class="input-field" onchange="Docket.renderFeeTable()">
          <optgroup label="특허">
            <option value="patent-priority">우선 특허출원 + 중간사건</option>
            <option value="patent-priority-guarantee">우선 특허출원 등록보장</option>
            <option value="patent-division-priority">분할출원 (우선)</option>
            <option value="patent-division-general">분할출원 (일반)</option>
            <option value="patent-pct">PCT 출원</option>
          </optgroup>
          <optgroup label="상표">
            <option value="tm-general">일반 상표출원</option>
            <option value="tm-priority">우선 상표출원 + 중간사건</option>
            <option value="tm-priority-reg">우선 상표출원 + 중간 + 등록</option>
            <option value="tm-oa">상표 중간사건 (의견서 대응)</option>
            <option value="tm-cancel-trial">취소심판</option>
          </optgroup>
        </select>
      </div>
      <div>
        <label>건수</label>
        <input type="number" class="input-field" id="dkt-case-count" value="1" min="1" max="99" onchange="Docket.renderFeeTable()" />
      </div>
      <div>
        <label>당소번호</label>
        <input type="text" class="input-field" id="dkt-case-number" placeholder="25P1048" />
      </div>
      <div>
        <label>날짜</label>
        <input type="date" class="input-field" id="dkt-date" />
      </div>
      <div>
        <label>수신 (고객사명)</label>
        <input type="text" class="input-field" id="dkt-client-name" placeholder="주식회사 OOO" />
      </div>
      <div>
        <label>명칭 (발명/상표)</label>
        <input type="text" class="input-field" id="dkt-case-title" placeholder="(가칭) 발명명칭 또는 상표명" />
      </div>
    </div>

    <!-- 대리인수수료 -->
    <div class="dkt-section-title">
      <span>💰 대리인수수료</span>
      <button class="btn btn-outline btn-sm" onclick="Docket.addRow('dkt-fee-items')">+ 항목 추가</button>
    </div>
    <table class="dkt-edit-table">
      <thead>
        <tr><th style="width:25%">항목</th><th style="width:18%">단가</th><th style="width:10%">수량</th><th style="width:17%">금액</th><th>비고</th><th></th></tr>
      </thead>
      <tbody id="dkt-fee-items"></tbody>
    </table>

    <!-- 담당 변리사 우대 (할인) -->
    <div class="dkt-discount-box">
      <label>🏷️ 담당 변리사 우대</label>
      <input type="text" class="input-field" id="dkt-discount-attorney" value="노재일" placeholder="변리사명" />
      <label>할인 단가</label>
      <input type="number" class="input-field" id="dkt-discount-amount" value="0" onchange="Docket.recalc()" placeholder="-200000" />
      <label>수량</label>
      <input type="number" class="input-field" id="dkt-discount-qty" value="1" min="1" onchange="Docket.recalc()" style="width:50px" />
    </div>

    <!-- 특허청관납료 -->
    <div class="dkt-section-title">
      <span>🏛️ 특허청관납료</span>
      <button class="btn btn-outline btn-sm" onclick="Docket.addRow('dkt-gov-items')">+ 항목 추가</button>
    </div>
    <table class="dkt-edit-table">
      <thead>
        <tr><th style="width:25%">항목</th><th style="width:18%">단가</th><th style="width:10%">수량</th><th style="width:17%">금액</th><th>비고</th><th></th></tr>
      </thead>
      <tbody id="dkt-gov-items"></tbody>
    </table>

    <!-- 합계 -->
    <div class="dkt-totals">
      <div class="dkt-totals-row"><span>대리인수수료 소계</span><span id="dkt-fee-subtotal">0</span></div>
      <div class="dkt-totals-row discount"><span>담당 변리사 우대</span><span id="dkt-discount-total">0</span></div>
      <div class="dkt-totals-row"><span>부가가치세 (10%)</span><span id="dkt-vat">0</span></div>
      <div class="dkt-totals-row"><span>대리인수수료 + VAT</span><span id="dkt-fee-with-vat">0</span></div>
      <div class="dkt-totals-row"><span>특허청관납료 소계</span><span id="dkt-gov-subtotal">0</span></div>
      <div class="dkt-totals-row grand"><span>견적금액 총계</span><span id="dkt-grand-total">0</span></div>
      <div class="dkt-totals-korean" id="dkt-grand-total-korean"></div>
    </div>

    <!-- 하단 버튼 -->
    <div class="dkt-actions">
      <button class="btn btn-ghost" onclick="Docket.resetForm()"><span class="tossface">🔄</span> 초기화</button>
      <button class="btn btn-outline" onclick="Docket.downloadExcel()"><span class="tossface">📥</span> 엑셀 다운로드</button>
      <button class="btn btn-primary" id="dkt-send-btn" onclick="Docket.preview()"><span class="tossface">📧</span> 미리보기 & 발송</button>
    </div>
  </div>
</div>

<!-- ═══ 미리보기 모달 ═══ -->
<div id="docketPreviewModal" class="modal-overlay" style="display:none">
  <div class="modal-content" style="max-width:700px;padding:24px;max-height:90vh;overflow-y:auto">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div class="modal-title" style="margin:0"><span class="tossface">📧</span> 견적서 미리보기</div>
      <button class="btn btn-ghost btn-sm" onclick="Docket.closePreview()">✕</button>
    </div>
    <div id="docket-preview-content"></div>
    <div style="display:flex;gap:8px;margin-top:20px">
      <button class="btn btn-ghost" onclick="Docket.closePreview()" style="flex:1">닫기</button>
      <button class="btn btn-outline" onclick="Docket.downloadExcel()" style="flex:1"><span class="tossface">📥</span> 엑셀만 다운로드</button>
      <button class="btn btn-primary" id="dkt-send-btn" onclick="Docket.sendEmail()" style="flex:1"><span class="tossface">📧</span> 견적서 발송</button>
    </div>
  </div>
</div>
